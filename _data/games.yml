# The home page reads this list to dress up each game's tile.
# Each entry starts with the game's folder name (the part after games/).
#   title:     the name shown on the tile
#   icon:      one emoji shown above the name
#   blurb:     a short line under the name (keep it to about 4 words)
#   tile:      (optional) the tile's background, ideally a color from the game
#   tile_text: (optional) the text color on that background
# A game left out of this list still shows on the home page, with its folder
# name and a game controller icon. A game with no tile color gets the next
# color in the home page's pink, cyan, lime, violet rotation.

stand-clear:
  title: Stand Clear
  icon: "🚦"
  blurb: Get there in time
  # The yellow of the "40 Stories" button in the game.
  tile: "#F6BC26"
  tile_text: "#111111"

turn-based-tennis:
  title: Turn Based Tennis
  icon: "🎾"
  blurb: Pick your shot
  # The game's dark green background, lighter at the top like in the game.
  tile: "radial-gradient(ellipse at top, #1d4a31 0%, #12301f 70%)"
  tile_text: "#f3f6ef"

almond-allergy:
  title: Almond Allergy
  icon: "🍫"
  blurb: Avoid the almonds
  # The milk chocolate and dark chocolate from the pixel palette.
  tile: "linear-gradient(145deg, #8c5a3c 0%, #5c3a2e 100%)"
  tile_text: "#fff6ec"
